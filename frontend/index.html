<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickPool — Tricity Ride Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f7f6f2;
            color: #161615;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen antialiased selection:bg-orange-500 selection:text-white">

    <!-- Minimalist Product Header -->
    <header class="max-w-6xl mx-auto px-4 sm:px-8 pt-6 pb-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-3.5 h-3.5 rounded-full bg-orange-600 ring-4 ring-orange-600/20"></div>
            <span class="font-display text-xl font-bold tracking-tight text-stone-900">quickpool</span>
            <span class="text-xs font-medium text-stone-400 hidden sm:inline">/ tricity commuter network</span>
        </div>

        <div id="api-status" class="text-xs font-medium text-stone-500 bg-stone-200/70 px-3 py-1 rounded-full">
            connecting...
        </div>
    </header>

    <!-- Two-Column Workspace -->
    <main class="max-w-6xl mx-auto px-4 sm:px-8 py-4 pb-16 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- LEFT COLUMN (5 cols): Dark Command Box + Route Composer -->
        <section class="lg:col-span-5 space-y-5">

            <!-- Dark Charcoal Command Box for AI Parsing -->
            <div class="bg-[#161615] text-stone-100 p-5 rounded-2xl shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        <h2 class="font-display text-xs font-semibold uppercase tracking-wider text-stone-300">
                            Smart Paste
                        </h2>
                    </div>
                    <button id="sample-ai-btn" type="button"
                        class="text-xs text-orange-400 hover:text-orange-300 transition font-medium">
                        Try sample message &rarr;
                    </button>
                </div>
                <p class="text-xs text-stone-400 mb-3">
                    Copy a ride message from Messenger or Slack—we'll extract the route, time, and price.
                </p>
                <textarea id="ai-raw-text" rows="2"
                    placeholder="e.g. Jutro o 8:15 jadę z Wrzeszcza pod Olivię, mam 3 miejsca po 10 zł..."
                    class="w-full rounded-xl bg-stone-800/90 border border-stone-700 p-3 text-xs text-white placeholder:text-stone-500 focus:border-orange-500 focus:outline-none transition"></textarea>
                <button id="ai-parse-btn" type="button"
                    class="mt-2.5 w-full bg-orange-600 hover:bg-orange-500 text-white font-medium py-2 px-4 rounded-xl text-xs transition">
                    Auto-fill form from text
                </button>
            </div>

            <!-- White Route Composer Card -->
            <div class="bg-white p-6 rounded-2xl border border-stone-200/90 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
                <div class="flex items-center justify-between mb-5">
                    <h2 id="form-title" class="font-display text-base font-bold text-stone-900">
                        Post a Ride
                    </h2>
                    <button id="cancel-edit-btn" type="button"
                        class="hidden text-xs font-medium text-orange-600 hover:underline">
                        Discard edit
                    </button>
                </div>

                <form id="ride-form" class="space-y-4">
                    <input type="hidden" id="ride-id" />

                    <!-- Visual Route Input Box (Timeline on the left) -->
                    <div class="bg-[#f7f6f2] p-3.5 rounded-xl border border-stone-200/80 flex gap-3 items-center">
                        <div class="flex flex-col items-center py-1">
                            <span class="w-2.5 h-2.5 rounded-full border-2 border-stone-500 bg-white"></span>
                            <span class="w-0.5 h-7 bg-stone-300 my-1"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-orange-600"></span>
                        </div>
                        <div class="flex-1 space-y-2">
                            <input type="text" id="origin" required minlength="2"
                                placeholder="Pickup point (e.g. Gdańsk Wrzeszcz)"
                                class="w-full bg-white border border-stone-200 rounded-lg px-3 py-1.5 text-sm focus:border-stone-900 focus:outline-none" />
                            <input type="text" id="destination" required minlength="2"
                                placeholder="Drop-off point (e.g. Olivia Star)"
                                class="w-full bg-white border border-stone-200 rounded-lg px-3 py-1.5 text-sm focus:border-stone-900 focus:outline-none" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label for="driver_name" class="block text-xs font-medium text-stone-500 mb-1">Driver
                                name</label>
                            <input type="text" id="driver_name" required minlength="2" maxlength="50"
                                placeholder="Marek K."
                                class="w-full bg-[#f7f6f2] focus:bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:border-stone-900 focus:outline-none transition" />
                        </div>
                        <div>
                            <label for="departure_time" class="block text-xs font-medium text-stone-500 mb-1">Departure
                                time</label>
                            <input type="text" id="departure_time" required placeholder="Tomorrow, 08:15"
                                class="w-full bg-[#f7f6f2] focus:bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:border-stone-900 focus:outline-none transition" />
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="available_seats" class="block text-xs font-medium text-stone-500 mb-1">Available
                                seats</label>
                            <input type="number" id="available_seats" required min="0" max="8" value="3"
                                class="w-full bg-[#f7f6f2] focus:bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm font-display font-semibold focus:border-stone-900 focus:outline-none transition" />
                        </div>
                        <div>
                            <label for="price_pln" class="block text-xs font-medium text-stone-500 mb-1">Contribution
                                (PLN)</label>
                            <input type="number" id="price_pln" required min="0" max="500" step="0.5" value="10"
                                class="w-full bg-[#f7f6f2] focus:bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm font-display font-semibold focus:border-stone-900 focus:outline-none transition" />
                        </div>
                    </div>

                    <div>
                        <label for="notes" class="block text-xs font-medium text-stone-500 mb-1">Trip notes</label>
                        <input type="text" id="notes" maxlength="300"
                            placeholder="Optional: luggage space, exact stop..."
                            class="w-full bg-[#f7f6f2] focus:bg-white border border-stone-200 rounded-lg px-3 py-2 text-sm focus:border-stone-900 focus:outline-none transition" />
                    </div>

                    <button id="submit-btn" type="submit"
                        class="w-full bg-[#161615] hover:bg-orange-600 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition duration-150">
                        Publish Ride
                    </button>
                </form>
            </div>
        </section>

        <!-- RIGHT COLUMN (7 cols): Search Bar & Ticket Feed -->
        <section class="lg:col-span-7 space-y-4">

            <!-- Search & Filter Bar -->
            <div class="flex gap-2.5">
                <input type="text" id="search-input" placeholder="Search routes, districts, or drivers..."
                    class="w-full bg-white border border-stone-200/90 rounded-xl px-4 py-2.5 text-sm placeholder:text-stone-400 focus:border-stone-900 focus:outline-none shadow-[0_2px_10px_rgba(0,0,0,0.02)]" />
                <button id="refresh-btn" type="button"
                    class="bg-white hover:bg-stone-100 border border-stone-200/90 text-stone-700 text-xs font-semibold px-4 py-2.5 rounded-xl transition shrink-0">
                    Refresh
                </button>
            </div>

            <!-- Feedback Banner -->
            <div id="toast" class="hidden px-4 py-3 rounded-xl text-xs font-medium"></div>

            <!-- Rides Feed -->
            <div id="rides-container" class="space-y-3">
                <p class="text-xs text-stone-400 py-12 text-center">Loading active routes...</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
